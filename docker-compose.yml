services:
  database:
    image: postgres:16
    container_name: homelab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: homelab
      POSTGRES_USER: alex
      POSTGRES_PASSWORD: dev-password-change-me

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alex -d homelab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
